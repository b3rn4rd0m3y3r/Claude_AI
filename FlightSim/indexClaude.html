<script>
const S=.8,N=5,T=2048*S,W=T*N,RX=W/2,RZ0=W+700,RZ1=RZ0+1800,PI=Math.PI,D=a=>a*PI/180,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let sd=7;const rnd=()=>{sd|=0;sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
// ---------- renderização por software: canvas 2D, sem WebGL e sem three.js ----------
const SKYC=[169,208,234],ZENC=[43,111,192];
const HS=[.8745,.9333,1],HG=[.3333,.4392,.2902],SUNC=[1,.949,.847],LL=(l=>[.5/l,.8/l,.3/l])(Math.hypot(.5,.8,.3));
function hex(s){const n=parseInt(s.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]}
function hsl(H,Sa,L){const q=L<.5?L*(1+Sa):L+Sa-L*Sa,p=2*L-q,f=t=>{t=(t%1+1)%1;return t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p};return[f(H+1/3),f(H),f(H-1/3)]}
// iluminação Lambert: luz hemisférica (.9) + luz direcional do sol (.85), como na versão three.js
function lit(c,nx,ny,nz){const hw=.5+.5*ny,sd=Math.max(0,nx*LL[0]+ny*LL[1]+nz*LL[2])*.85;
 return[0,1,2].map(i=>255*c[i]*((HG[i]+(HS[i]-HG[i])*hw)*.9+SUNC[i]*sd))}
function fogF(d){if(d<=1500)return 0;if(d>=26000)return 1;const t=(d-1500)/24500;return t*t*(3-2*t)}
const cs=new Map();
function css(r,g,b,f){if(f){r+=(169-r)*f;g+=(208-g)*f;b+=(234-b)*f}
 r=r<0?0:r>255?255:r>>2<<2;g=g<0?0:g>255?255:g>>2<<2;b=b<0?0:b>255?255:b>>2<<2;
 const k=r<<16|g<<8|b;let s=cs.get(k);if(!s){s="rgb("+r+","+g+","+b+")";cs.set(k,s)}return s}
function ctex(w,h,fn){const c=document.createElement("canvas");c.width=w;c.height=h;fn(c.getContext("2d"),w,h);return c}
// campo ao redor
const P6=["#6a9a4a","#547f3e","#8a9a4c","#a39a58","#4f7a3a","#759c52"];
const fieldC=ctex(512,512,(g,w,h)=>{g.fillStyle="#5d8f45";g.fillRect(0,0,w,h);for(let i=0;i<70;i++){g.fillStyle=P6[i%6];g.fillRect(rnd()*w,rnd()*h,40+rnd()*130,40+rnd()*120)}});
// cidade: a planta SVG vira textura do chão, repetida 3x3
const cc=document.createElement("canvas");cc.width=cc.height=2048;{const g=cc.getContext("2d");g.fillStyle="#568c45";g.fillRect(0,0,2048,2048)}
const svg=document.getElementById("pista-svg"),im=new Image();
